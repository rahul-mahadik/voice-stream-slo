[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "voice-stream-slo"
version = "0.1.0"
description = "Provider-neutral streaming TTS reliability benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rahul Mahadik" }]
dependencies = [
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "python-dotenv>=1,<2",
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.6,<1",
]

[project.scripts]
voice-stream-slo = "voice_stream_slo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_stream_slo"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
